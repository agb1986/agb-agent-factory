name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-bump check compares against the merge base, which needs the history.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The rg.search tests skip without ripgrep, which would hide them from the coverage floor.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # The sandbox tests skip without this image, which would hide them from the coverage floor.
      - name: Build the sandbox image
        run: docker build -t factory-sandbox:0.1 -f tools/sandbox.Dockerfile tools

      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

      - name: Tests with coverage
        run: uv run pytest -m "not live and not live_jev" --cov --cov-fail-under=85

      - name: Version bump
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check_version_bump.py "origin/${{ github.base_ref }}"

  # Builds the deployment image and fails when any layer or the image configuration holds a key.
  # It needs no secret: the scan looks for the shape of a key, not for a value.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t agb-agent-factory:ci .

      - name: Run it
        run: docker run --rm agb-agent-factory:ci --version

      - name: Scan the image for key-like strings
        run: python3 scripts/scan_image.py agb-agent-factory:ci

      # The scan is only worth having if it fails on a key. The literals are assembled here, so
      # this file holds none, and each lands in a layer and in the build history of a derived image.
      - name: The scan fails on a planted key
        run: |
          set -u
          for prefix in sk-ant- whk_; do
            planted="${prefix}$(printf 'Z%.0s' $(seq 24))"
            printf 'FROM agb-agent-factory:ci\nUSER root\nARG PLANT\nRUN echo "$PLANT" > /opt/planted\n' \
              | docker build -q -t "planted:${prefix%[-_]}" --build-arg "PLANT=${planted}" -f - .
            if python3 scripts/scan_image.py "planted:${prefix%[-_]}"; then
              echo "scan passed an image with a planted ${prefix} key" >&2
              exit 1
            fi
          done
