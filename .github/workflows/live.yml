name: live

# Tests that call the real APIs. Run by hand: gh workflow run live.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: uv sync --locked

      # A test whose key is not set skips itself (see tests/conftest.py), so a missing secret
      # shows up as skipped tests, not as a failure.
      - run: uv run pytest -m "live or live_jev" -ra
