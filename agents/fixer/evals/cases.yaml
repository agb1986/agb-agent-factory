# Eval cases for fixer. Each one gives the agent a reviewer's finding and the test files that cover
# it, for a fixture from fixtures/src/, and grades the work tree it leaves: the sandbox runs the
# whole suite and compares what changed (expected.run). `repo_path` is not in the payload: the eval
# runner fills it in with a private copy of the built fixture repository.
cases:
  - id: off-by-one-red
    fixture: off-by-one-red
    payload:
      finding:
        file: series/rolling.py
        line_start: 12
        line_end: 13
        severity: major
        category: logic
        title: Loop bound drops the last window
        body: >-
          The running-sum loop stops at len(values) - 1, so the last window is never added. For
          [1, 2, 3, 4] with a window of 2 it returns [3, 5] instead of [3, 5, 7].
        suggested_fix: "range(window, len(values))"
      test_files: [tests/test_rolling.py]
    expected:
      verdict: null
      criteria: >-
        The summary names the loop bound as the cause and says it was changed in series/rolling.py.
        The change is small and touches only the loop bound.
      run:
        suite: pass
        production: changed
        tests: unchanged
    grader: sandbox_tests

  - id: untested-change-covered
    fixture: untested-change-covered
    payload:
      finding:
        file: pricing/discount.py
        line_start: 4
        line_end: 8
        severity: minor
        category: testing
        title: New public function has no test
        body: >-
          apply_discount has a validation branch and a rounding rule, and no test covers either.
      test_files: [tests/test_discount.py]
    expected:
      verdict: null
      criteria: >-
        The summary says nothing needs fixing because the listed tests already pass.
        No file was changed.
      run:
        suite: pass
        production: unchanged
        tests: unchanged
    grader: sandbox_tests

  - id: free-shipping-boundary
    fixture: mixed-red
    payload:
      finding:
        file: shop/shipping.py
        line_start: 12
        line_end: 12
        severity: major
        category: logic
        title: Free shipping no longer applies at exactly the threshold
        body: >-
          The docstring and the previous code give free shipping at or above the threshold. The new
          comparison charges 499 for an order of exactly 5000.
        suggested_fix: "subtotal >= FREE_SHIPPING_THRESHOLD"
      test_files: [tests/test_shop.py]
    expected:
      verdict: null
      criteria: >-
        The summary names the comparison in shipping_cost as the cause and says it was changed in
        shop/shipping.py. Only shop/shipping.py changes: shop/format.py, whose camelCase local is a
        style nit and not part of this finding, and shop/config.py are left as they were.
      run:
        suite: pass
        production: changed
        tests: unchanged
    grader: sandbox_tests

  - id: name-interpolated-into-sql
    fixture: sql-injection-red
    payload:
      finding:
        file: accounts/db.py
        line_start: 30
        line_end: 31
        severity: blocker
        category: security
        title: SQL injection through the name argument
        body: >-
          The caller-supplied name is formatted into the SQL text. A name such as ' OR '1'='1 returns
          every user. Use a placeholder: WHERE name = ?, with (name,) as the parameters.
        suggested_fix: "conn.execute(\"SELECT id, name, email FROM users WHERE name = ?\", (name,))"
      test_files: [tests/test_db.py]
    expected:
      verdict: null
      criteria: >-
        The summary names the formatted SQL text in find_by_name as the cause and says the query now
        uses a placeholder with the name passed as a parameter. Only accounts/db.py changes, and the
        other queries in it are left as they were.
      run:
        suite: pass
        production: changed
        tests: unchanged
    grader: sandbox_tests
