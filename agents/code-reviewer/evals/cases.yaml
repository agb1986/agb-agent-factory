# Eval cases for code-reviewer. Each one reviews a fixture repository from fixtures/src/; the
# expected defects mirror that fixture's defects.yaml. `repo_path` is not in the payload: the eval
# runner fills it in with the built fixture repository.
cases:
  - id: off-by-one
    fixture: off-by-one
    payload:
      base: base
      head: head
    expected:
      verdict: request_changes
      defects:
        - id: last-window-dropped
          file: series/rolling.py
          line_start: 12
          line_end: 13
          severity_floor: major
    grader: llm_judge

  - id: clean-refactor
    fixture: clean-refactor
    payload:
      base: base
      head: head
    expected:
      verdict: approve
      defects: []
    grader: llm_judge

  - id: untested-change
    fixture: untested-change
    payload:
      base: base
      head: head
    expected:
      verdict: approve
      defects:
        - id: apply-discount-untested
          file: pricing/discount.py
          line_start: 4
          line_end: 8
          severity_floor: minor
    grader: llm_judge

  - id: mixed
    fixture: mixed
    payload:
      base: base
      head: head
    expected:
      verdict: request_changes
      defects:
        - id: free-shipping-boundary
          file: shop/shipping.py
          line_start: 12
          line_end: 12
          severity_floor: major
        - id: camel-case-locals
          file: shop/format.py
          line_start: 6
          line_end: 7
          severity_floor: info
    grader: llm_judge
