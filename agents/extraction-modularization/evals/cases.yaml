      rubric:
        threshold: 0.7
        required_fields: *required-fields
        forbidden: *forbidden
        paths_exist: [pinning_tests.*.path]
        criteria:
          - &discounts-invariants-real-and-testable
            id: invariants-real-and-testable
            text: >-
              Each invariant is a rule the code keeps and a test can check, with what is given and
              what must come out. Together they cover most of these facts and contradict none: at
              most one discount applies, the larger of promotion and loyalty, and the promotion
              when both are equal; an unknown promotion code gives no promotion discount and a
              warning; a code used up to its limit by a customer gives none; loyalty gives 5
              percent from 12 months on and nothing before; a use of the code is counted only when
              the promotion is the discount that applies.
            required: true
            floor: 0.6
          - &discounts-enough-for-a-coder
            id: enough-for-a-coder
            text: >-
              A coder who has not read the codebase could write the feature from the blueprint
              alone. The inputs name the charges and the period of the invoice, the customer's
              code and joining day, the promotion codes with percentage and limit, and the loyalty
              settings with their values. The outputs name the negative discount line on the
              invoice, the saved count of uses of the code, the warning and the counter of the
              run.
            required: true
            floor: 0.6
          - *language-agnostic
          - &discounts-ties-can-be-cut
            id: ties-can-be-cut
            text: >-
              The uses, the calls into the feature and the shared state say what each side relies
              on and how the tie can be cut without changing behaviour, so that the warnings, the
              counter of the run and the billing of a customer still work after the move.
    grader: rubric
