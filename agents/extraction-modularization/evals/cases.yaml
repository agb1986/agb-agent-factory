# Eval cases for extraction-modularization, all on fixtures/src/legacy-billing, the decomposition
# target of docs/decisions/0005-decomposition-target.md. Each one is graded by the rubric grader. Its
# deterministic checks run first: the ground_truth checks compare the blueprint's boundary and ties
# with a feature of the fixture's ground-truth.yaml, named here by id (evals/graders/ground_truth.py,
# docs/evals.md). The judge then reads the prose, which has no ground truth.
#
# The archaeology in a payload is a correct answer of code-archaeology, built from the outputs of the
# deps tools on the built fixture. It describes the codebase and never says what belongs to the
# feature. The cases differ in how much of the codebase it covers. `repo_path` is not in the payload:
# the eval runner fills it in with the built fixture repository, which holds `head/` only, so the
# agent cannot read the ground truth.
#
# The target is synthetic and small. A pass rate here shows that the agent finds a boundary that was
# planted in a small codebase. It does not show that the agent holds up on a large or a real one.
cases:
  # The whole program, read from the command line.
  - id: late-fees-full-map
    fixture: legacy-billing
    payload:
      feature:
        name: Late fees
        start: legacy_billing/billing.py::apply_late_fees
      archaeology: &full-map
        summary: >-
          A command line program that bills subscription customers. cli.py parses a command and
          calls one function of the billing, payments, importer, customers or reports module.
          billing.py is the largest module: it runs the monthly billing, and also holds discounts,
          late fees, credit notes, statements, exports and the period close. Rows are kept in JSON
          files through storage.py. Much passes through the dictionaries of state.py and not
          through calls: counters of the run, cached customers, warnings and hooks. Three calls
          cannot be tied to one function by reading: the hooks called when an invoice is posted,
          the export picked by the name of the format, and the report looked up by name.
        modules:
          - {path: "legacy_billing/cli.py", role: "Parses the command line and hands each command to
             the module that does the work.", imports: ["legacy_billing/audit.py",
             "legacy_billing/billing.py", "legacy_billing/customers.py",
             "legacy_billing/importer.py", "legacy_billing/payments.py",
             "legacy_billing/reports.py", "legacy_billing/storage.py"]}
          - {path: "legacy_billing/billing.py", role: "The largest module: the billing run, prices,
             discounts, late fees, credit notes, statements, exports and period close.", imports:
             ["legacy_billing/catalog.py", "legacy_billing/customers.py", "legacy_billing/dates.py",
             "legacy_billing/exporters.py", "legacy_billing/invoices.py",
             "legacy_billing/ledger.py", "legacy_billing/money.py", "legacy_billing/notify.py",
             "legacy_billing/numbering.py", "legacy_billing/settings.py", "legacy_billing/state.py",
             "legacy_billing/storage.py", "legacy_billing/taxes.py", "legacy_billing/usage.py"]}
          - {path: "legacy_billing/audit.py", role: "Saves a trail of posted invoices; it registers
             itself as a hook in the shared state.", imports: ["legacy_billing/state.py",
             "legacy_billing/storage.py"]}
          - {path: "legacy_billing/storage.py", role: "Reads and writes the tables, each one a JSON
             file in the data directory of the run.", imports: ["legacy_billing/state.py"]}
          - {path: "legacy_billing/customers.py", role: "Customer rows, cached in the shared state
