name: extraction-modularization
version: 0.1.0
kind: llm
team: decomp
description: Draws the boundary of one feature in a Python codebase from its archaeology and returns a language-agnostic blueprint with the feature's inputs, outputs, invariants, pinning tests and the code ties to cut. Changes no files.
model: claude-sonnet-5-5 # verified by tests/live/test_extraction_modularization_live.py
effort: high
system_prompt: system.md
schemas: schemas.py
input_model: ExtractionModularizationInput
output_model: ExtractionBlueprint
tools:
  # Archaeology maps the codebase but does not say what belongs to one feature, so the agent reads
  # the source and the calls itself. No sandbox: nothing is run.
  allow: [git.read_file, rg.search, deps.graph, deps.impact, deps.call_graph]
  deny: []
limits:
  max_tool_turns: 25
  timeout_s: 600
  max_output_tokens: 16000
  max_tokens_total: 600000
evals:
  min_pass_rate: 0.75
