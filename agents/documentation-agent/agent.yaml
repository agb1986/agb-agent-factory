name: documentation-agent
version: 0.1.0
kind: llm
team: dev
description: Writes the README, docs and docstrings a merged change needs, and changes no code.
model: claude-sonnet-5-5 # verified by tests/live/test_documentation_agent_live.py
effort: xhigh
system_prompt: system.md
schemas: schemas.py
input_model: DocumentationAgentInput
output_model: DocumentationAgentOutput
sandbox: true
guard: action-guard@^0.1
tools:
  allow: [fs.list_files, fs.read_file, fs.write_file, shell.run]
  deny: []
files:
  # A docs change writes prose: Markdown anywhere and anything under docs/, and the docstrings and
  # comments of source files in the languages pipelines.docs_check.COMMENT_SYNTAX knows. The build
  # loop's DocsCheck then refuses a round that changed code, so the allow list only keeps the agent
  # away from files it could never change. Keep it in step with DOCS_GLOBS and COMMENT_SYNTAX.
  allow:
    - "**/*.md"
    - "docs/**"
    - "**/*.py"
    - "**/*.sh"
    - "**/*.bash"
    - "**/*.toml"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.cfg"
    - "**/*.ini"
    - "**/*.js"
    - "**/*.mjs"
    - "**/*.ts"
    - "**/*.go"
    - "**/*.rs"
    - "**/*.java"
    - "**/*.c"
    - "**/*.h"
  # The tests and how the suite runs stay as they are, the same list as the refactorer's.
  deny:
    # version control and CI
    - ".git/**"
    - ".github/**"
    # the test layout, as evals.graders.sandbox_tests.is_test_file defines it
    - "**/tests/**"
    - "**/conftest.py"
    - "**/test_*.py"
    - "**/*_test.py"
    # pytest's configuration at the root of the repository
    - pytest.ini
    - .pytest.ini
    - pytest.toml
    - .pytest.toml
    - pyproject.toml
    - setup.cfg
    - tox.ini
    # root modules and packages named like one `python -m pytest` imports, which would replace it
    - "pytest/**"
    - pytest.py
    - "pytest.*.py"
    - pytest.pyc
    - "pytest.*.pyc"
    - pytest.so
    - "pytest.*.so"
    - "_pytest/**"
    - _pytest.py
    - "_pytest.*.py"
    - _pytest.pyc
    - "_pytest.*.pyc"
    - _pytest.so
    - "_pytest.*.so"
    - "pluggy/**"
    - pluggy.py
    - "pluggy.*.py"
    - pluggy.pyc
    - "pluggy.*.pyc"
    - pluggy.so
    - "pluggy.*.so"
    - "iniconfig/**"
    - iniconfig.py
    - "iniconfig.*.py"
    - iniconfig.pyc
    - "iniconfig.*.pyc"
    - iniconfig.so
    - "iniconfig.*.so"
    - "packaging/**"
    - packaging.py
    - "packaging.*.py"
    - packaging.pyc
    - "packaging.*.pyc"
    - packaging.so
    - "packaging.*.so"
limits:
  max_tool_turns: 30
  timeout_s: 900
  max_output_tokens: 8192
  max_tokens_total: 300000
evals:
  min_pass_rate: 0.75
