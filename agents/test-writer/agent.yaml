name: test-writer
version: 0.2.0
kind: llm
description: Writes a test that reproduces a reported defect and sees it fail in the sandbox, or, in cover mode, passing tests for the uncovered lines of given files.
model: claude-sonnet-5-5 # verified by tests/live/test_test_writer_live.py
effort: xhigh
system_prompt: system.md
schemas: schemas.py
input_model: TestWriterInput
output_model: TestWriterOutput
sandbox: true
guard: action-guard@^0.1
tools:
  allow: [fs.list_files, fs.read_file, fs.write_file, shell.run]
  deny: []
limits:
  max_tool_turns: 25
  timeout_s: 600
  max_output_tokens: 8192
  max_tokens_total: 200000
evals:
  min_pass_rate: 0.75
