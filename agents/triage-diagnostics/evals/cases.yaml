        count: 12
        user_count: 3
        first_seen: "2026-11-20T02:00:05Z"
        last_seen: "2026-11-20T14:00:04Z"
        release: head
        event_id: 7d9e1f3a5b7c4d9e8f0a2b4c6d8e0f1a
        exceptions:
          - type: ValueError
            value: "invalid literal for int() with base 10: ''"
            frames:
              - file: /app/feed/pricing.py
                function: feed_total
                line: 13
                in_app: true
              - file: /app/feed/pricing.py
                function: <genexpr>
                line: 13
                in_app: true
              - file: /app/feed/pricing.py
                function: line_total
                line: 8
                in_app: true
        breadcrumbs:
          - time: "2026-11-20T14:00:03Z"
