        last_seen: "2026-11-20T06:15:33Z"
        release: head
        event_id: 1c3e5a7b9d0f4e2a8b6c4d2e0f1a3b5c
        exceptions:
          - type: KeyError
            value: "'timeout'"
            frames:
              - file: /usr/local/lib/python3.13/site-packages/appconfig/client.py
                function: make_client
                line: 16
                in_app: true
              - file: /usr/local/lib/python3.13/site-packages/appconfig/settings.py
                function: timeout_seconds
