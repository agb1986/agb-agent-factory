# Eval cases for triage-diagnostics. Each one pairs a fixture from fixtures/src/ that plants a
# crash on `head` with a hand-written Sentry payload, in the shape `sentry.read_issue` returns, for
# that crash. No case reads Sentry. `head` plays the release tag: the event's `release` and the
# payload's `ref` both name it. The incident grader checks two things and calls no judge: the
# answer's suspected_paths list the file of the planted fault, and its reproduction test, run at
# `head` in the offline sandbox, fails with the event's exception raised from the crash file.
# Frame paths carry a production prefix (`/app/`, site-packages) on purpose, as real ones do.
# `crash-loader-caller` is the case where the fault is one frame above the raising one.
# `repo_path` is not in the payload: the eval runner fills it in with the built fixture repository.
cases:
  - id: empty-ratings-divide-by-zero
    fixture: crash-empty-average
    payload:
      ref: head
      event:
        id: "4501"
        short_id: SHOP-7A
        title: "ZeroDivisionError: division by zero"
        culprit: reviews.scores in average_rating
        level: error
        status: unresolved
        count: 214
        user_count: 61
        first_seen: "2026-11-18T09:12:44Z"
        last_seen: "2026-11-20T15:02:10Z"
        release: head
        first_release: head
        last_release: head
        event_id: 9b2f6c1e4d8a4f37a0c1b2d3e4f5a6b7
        exceptions:
          - type: ZeroDivisionError
            value: division by zero
            frames:
              - file: /app/reviews/listing.py
                function: product_line
                line: 8
                in_app: true
              - file: /app/reviews/scores.py
                function: average_rating
                line: 7
                in_app: true
        breadcrumbs:
          - time: "2026-11-20T15:02:09Z"
            category: http
            level: info
            message: GET /products/travel-mug
          - time: "2026-11-20T15:02:10Z"
            category: reviews
            level: info
            message: "loaded 0 ratings for product 'Travel mug'"
    expected:
      verdict: null
      incident:
        suspected_path: reviews/scores.py
        exception: ZeroDivisionError
        crash_file: reviews/scores.py
    grader: incident

