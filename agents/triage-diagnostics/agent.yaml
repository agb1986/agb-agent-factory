name: triage-diagnostics
version: 0.1.0
kind: llm
team: sre
description: Turns a Sentry event and the repository at its release tag into an incident diagnosis with reproduction steps, suspected paths, a confidence and a test that reproduces the crash.
model: claude-sonnet-5-5 # verified by tests/live/test_triage_diagnostics_live.py
effort: high
system_prompt: system.md
schemas: schemas.py
input_model: TriageDiagnosticsInput
output_model: TriageDiagnosticsOutput
tools:
  allow: [git.read_file, rg.search, deps.graph, deps.impact]
  deny: []
limits:
  max_tool_turns: 15
  timeout_s: 300
  max_output_tokens: 12000
  max_tokens_total: 300000
evals:
  min_pass_rate: 0.75
