[project]
name = "agb-agent-factory"
version = "0.1.0"
description = "A registry of small, versioned, scoped agents for software engineering work, and the pipelines that run them."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic",
    "duckdb",
    "packaging",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
jev = ["typesafe-sdk==0.7.5"]
# The optional HTTP trigger in `api/`; docs/deploy.md.
api = ["fastapi", "uvicorn"]

[project.scripts]
factory = "factory.cli:main"

[dependency-groups]
dev = [
    # The Jev extra, so `uv sync` can type-check and test `runtime/jev_transport.py`, and the API extra
    # for `api/`.
    "agb-agent-factory[jev,api]",
    # Starlette's TestClient, for api/.
    "httpx",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: `factory/` sits at the repository root next to `registry/`, `runtime/` and the rest.
module-root = ""
module-name = ["api", "evals", "factory", "pipelines", "registry", "runtime", "tools"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Default rules (E4, E7, E9, F) plus isort and pyupgrade.
extend-select = ["I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: needs FACTORY_LIVE=1 and a live ANTHROPIC_API_KEY; deselected without the opt-in, skipped without the key",
    "live_jev: needs FACTORY_LIVE=1 and a live TYPESAFE_API_KEY; deselected without the opt-in, skipped without the key",
]

[tool.coverage.run]
# `fixtures/` is measured too, but its source trees are data, not code under test.
source = ["api", "evals", "factory", "fixtures", "pipelines", "registry", "runtime", "tools"]
omit = ["fixtures/src/*", "fixtures/handmade/*", "fixtures/repos/*"]
