# Labelled diffs for calibrating the diff-triage skip threshold (#20). Schema:
# evals/calibration/labels.py; method and results: docs/jev-calibration.md.
#
# Each row is a merged pull request, stored as its repository URL and a commit pair, never as
# source: `base` is the first parent of the merge commit and `head` is the merge commit, so the diff
# is exactly what the pull request merged. scripts/calibrate.py fetches it from GitHub at run time.
# Most of the repositories are private (`private: true`), so a run needs a GitHub token that can
# read them.
#
# A diff is risky when its worst finding would be major or blocker on the reviewers' scale
# (agents/code-reviewer/system.md), and safe otherwise. `source` says which test decided it: `panel`
# for the full review panel's findings, `reader` for a careful reading of the diff. 98 rows are
# reader labels: docs-only, test-only and dependency-bump diffs were labelled by hand from their
# file lists and contents, and the rest were read in full. A reader reason may cite a later pull
# request that fixed the defect, as evidence the defect was real. The 28 rows the reader was unsure
# of were run through the full review panel on 2026-10-27 (judge@2.0.0 over code-reviewer@1.2.0,
# security-reviewer@1.0.0 and perf-reviewer@0.3.0, triage route only) and are panel labels: the
# severity is the worst finding the judge kept, info counting as none, and the reason gives the
# reader's earlier severity. The reader had marked 21 of them risky at severity major, wherever the
# doubt was whether a major finding exists at all; the panel kept a major finding in 8. The
# labelling spend was $9.10 of the $15 budget.

