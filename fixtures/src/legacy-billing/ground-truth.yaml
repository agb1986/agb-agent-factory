fixture: legacy-billing
package: legacy_billing

modules:
  - id: module-init
    path: legacy_billing/__init__.py
    role: The package, which re-exports main and to_major_units for partner scripts.
    imports: [legacy_billing/cli.py, legacy_billing/money.py]
  - id: module-main
    path: legacy_billing/__main__.py
    role: The entry point of python -m legacy_billing.
    imports: [legacy_billing/cli.py]
  - id: module-audit
    path: legacy_billing/audit.py
    role: The audit trail, which hooks itself into the billing run.
    imports: [legacy_billing/state.py, legacy_billing/storage.py]
  - id: module-billing
    path: legacy_billing/billing.py
    role: >-
      The oversized module: the billing run, prices, discounts, late fees, credit notes,
      statements, exports and the period close.
    imports:
      - legacy_billing/catalog.py
      - legacy_billing/customers.py
      - legacy_billing/dates.py
      - legacy_billing/exporters.py
      - legacy_billing/invoices.py
      - legacy_billing/ledger.py
      - legacy_billing/money.py
      - legacy_billing/notify.py
      - legacy_billing/numbering.py
      - legacy_billing/settings.py
      - legacy_billing/state.py
      - legacy_billing/storage.py
      - legacy_billing/taxes.py
      - legacy_billing/usage.py
  - id: module-catalog
    path: legacy_billing/catalog.py
    role: Plans, meter prices and promotion codes.
    imports: []
  - id: module-cli
    path: legacy_billing/cli.py
    role: The command line.
    imports:
      - legacy_billing/audit.py
      - legacy_billing/billing.py
      - legacy_billing/customers.py
      - legacy_billing/importer.py
      - legacy_billing/payments.py
      - legacy_billing/reports.py
      - legacy_billing/storage.py
  - id: module-customers
    path: legacy_billing/customers.py
    role: Customer rows, cached in the shared state.
    imports: [legacy_billing/dates.py, legacy_billing/state.py, legacy_billing/storage.py]
  - id: module-dates
    path: legacy_billing/dates.py
    role: ISO days and YYYY-MM periods.
    imports: []
  - id: module-exporters
    path: legacy_billing/exporters.py
    role: Ledger exports, picked by the name of the format.
    imports: [legacy_billing/money.py]
  - id: module-fax-gateway
    path: legacy_billing/fax_gateway.py
    role: Invoices by fax; nothing imports it.
    imports: [legacy_billing/settings.py, legacy_billing/storage.py]
  - id: module-importer
    path: legacy_billing/importer.py
    role: Reads usage files from the meters.
    imports: [legacy_billing/catalog.py, legacy_billing/state.py, legacy_billing/usage.py]
  - id: module-invoices
    path: legacy_billing/invoices.py
    role: The invoice object that the billing run fills in.
    imports: [legacy_billing/money.py]
  - id: module-ledger
    path: legacy_billing/ledger.py
    role: Postings and balances.
    imports: [legacy_billing/state.py, legacy_billing/storage.py]
  - id: module-money
    path: legacy_billing/money.py
    role: Amounts in cents, converted and rounded.
    imports: []
  - id: module-notify
    path: legacy_billing/notify.py
    role: Letters to customers, queued in the outbox table.
    imports: [legacy_billing/customers.py, legacy_billing/money.py, legacy_billing/storage.py]
  - id: module-numbering
    path: legacy_billing/numbering.py
    role: Document numbers.
    imports: [legacy_billing/state.py, legacy_billing/storage.py]
  - id: module-payments
    path: legacy_billing/payments.py
    role: Payments, put against the oldest unpaid invoices.
    imports: [legacy_billing/ledger.py, legacy_billing/state.py, legacy_billing/storage.py]
  - id: module-reports
    path: legacy_billing/reports.py
    role: Plain text reports, looked up by name in a table.
    imports:
      - legacy_billing/customers.py
      - legacy_billing/ledger.py
      - legacy_billing/money.py
      - legacy_billing/state.py
      - legacy_billing/storage.py
  - id: module-settings
    path: legacy_billing/settings.py
    role: Constants.
    imports: []
  - id: module-state
    path: legacy_billing/state.py
    role: The dictionaries and lists the whole package shares.
    imports: []
  - id: module-storage
    path: legacy_billing/storage.py
    role: Tables kept as JSON files in the data directory.
    imports: [legacy_billing/state.py]
  - id: module-taxes
    path: legacy_billing/taxes.py
    role: VAT by country.
    imports: [legacy_billing/money.py, legacy_billing/settings.py]
  - id: module-usage
    path: legacy_billing/usage.py
    role: Metered usage, one row per reading.
    imports: [legacy_billing/storage.py]

dead_code:
  - {id: dead-function, symbol: "legacy_billing/billing.py::prorate_by_weeks", kind: function}
  - {id: dead-class, symbol: "legacy_billing/customers.py::CustomerMerger", kind: class}
  - {id: dead-method, symbol: "legacy_billing/invoices.py::Invoice.as_legacy_row", kind: method}
