  - {id: dead-vat-rate, symbol: "legacy_billing/taxes.py::old_vat_rate", kind: function}
  - {id: dead-through-dead, symbol: "legacy_billing/taxes.py::_old_vat_table", kind: function}
  - {id: dead-copy, symbol: "legacy_billing/importer.py::_pad", kind: function}

decoys:
  - id: decoy-test-only
    kind: test_only
    symbol: legacy_billing/money.py::parse_amount
    evidence:
      symbol: tests/test_money.py
      snippet: parse_amount
    why: Only the tests call it.
  - id: decoy-test-reset
    kind: test_only
    symbol: legacy_billing/state.py::reset
    evidence:
      symbol: tests/conftest.py
      snippet: state.reset()
    why: Only the test set-up calls it.
  - id: decoy-report-balances
    kind: dispatch_table
    symbol: legacy_billing/reports.py::report_balances
    evidence:
      symbol: legacy_billing/reports.py::REPORTS
      snippet: '"balances": report_balances,'
    why: run_report looks it up in REPORTS by a string.
  - id: decoy-report-unpaid
    kind: dispatch_table
    symbol: legacy_billing/reports.py::report_unpaid
    evidence:
      symbol: legacy_billing/reports.py::REPORTS
      snippet: '"unpaid": report_unpaid,'
    why: run_report looks it up in REPORTS by a string.
  - id: decoy-report-warnings
    kind: dispatch_table
    symbol: legacy_billing/reports.py::report_warnings
    evidence:
      symbol: legacy_billing/reports.py::REPORTS
      snippet: '"warnings": report_warnings,'
    why: run_report looks it up in REPORTS by a string.
  - id: decoy-reexport
    kind: reexport
    symbol: legacy_billing/money.py::to_major_units
    evidence:
      symbol: legacy_billing/__init__.py
      snippet: from legacy_billing.money import to_major_units
    why: The package re-exports it for partner scripts; nothing in the tree calls it.
  - id: decoy-export-csv
    kind: dynamic_lookup
    symbol: legacy_billing/exporters.py::export_csv
    evidence:
      symbol: legacy_billing/billing.py::export_ledger
      snippet: getattr(exporters, "export_" + fmt, None)
    why: export_ledger builds its name from the format at run time; no code names it.
  - id: decoy-export-fixed
    kind: dynamic_lookup
    symbol: legacy_billing/exporters.py::export_fixed
    evidence:
      symbol: legacy_billing/billing.py::export_ledger
      snippet: getattr(exporters, "export_" + fmt, None)
    why: export_ledger builds its name from the format at run time; no code names it.
  - id: decoy-callback
    kind: callback
    symbol: legacy_billing/audit.py::log_posting
    evidence:
      symbol: legacy_billing/audit.py::install
      snippet: state.HOOKS.append(log_posting)
    why: It is registered as a hook and called through the list.

