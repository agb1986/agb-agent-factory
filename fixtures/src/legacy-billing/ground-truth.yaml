data_flows:
  - id: flow-usage-to-invoice
    data: The metered usage of a customer
    steps:
      - symbol: legacy_billing/importer.py::import_usage
        snippet: usage.record_usage(row["customer"], row["day"], row["meter"], int(row["quantity"]))
        does: Reads the readings from a CSV file.
      - symbol: legacy_billing/usage.py::record_usage
        snippet: storage.append_row(
        does: Saves each reading in the usage table.
      - symbol: legacy_billing/usage.py::usage_for
        snippet: 'for row in storage.read_rows("usage")'
        does: Adds up the readings of a customer per meter.
      - symbol: legacy_billing/billing.py::price_usage
        snippet: totals = usage.usage_for(customer["id"], invoice.period)
        does: Prices the totals and adds them to the invoice as lines.
      - symbol: legacy_billing/billing.py::post_invoice
        snippet: storage.append_row("invoices", row)
        does: Saves the invoice in the invoices table and posts its total.
  - id: flow-overdue-to-ledger
    data: The late fee on an overdue invoice
    steps:
      - symbol: legacy_billing/billing.py::overdue_invoices
        snippet: 'for row in storage.read_rows("invoices")'
        does: Reads the unpaid invoices that are past due.
      - symbol: legacy_billing/billing.py::late_fee_for
        snippet: owed = row["total"] - row["paid"]
        does: Takes the fee from what is open.
      - symbol: legacy_billing/billing.py::apply_late_fees
        snippet: storage.replace_row("invoices", "number", row)
        does: Writes the fee into the invoice row.
      - symbol: legacy_billing/ledger.py::post_entry
        snippet: storage.append_row("ledger", entry)
        does: Posts the fee to the ledger table.
      - symbol: legacy_billing/notify.py::queue_notice
        snippet: storage.append_row("outbox"
        does: Queues the letter about the fee in the outbox table.
  - id: flow-promo-to-discount
    data: The promotion code of a customer
    steps:
      - symbol: legacy_billing/cli.py::_add_customer
        snippet: '"promo": args.promo,'
        does: Takes the code from the command line.
      - symbol: legacy_billing/customers.py::add_customer
        snippet: storage.replace_row("customers", "id", row)
        does: Saves it in the customers table.
      - symbol: legacy_billing/customers.py::all_customers
        snippet: storage.read_rows("customers")
        does: Reads it back and caches it in the shared state.
      - symbol: legacy_billing/billing.py::promo_discount
        snippet: code = customer.get("promo")
        does: Looks the code up in the catalog and works out the discount.
      - symbol: legacy_billing/billing.py::apply_discounts
        snippet: invoice.add_line("discount", f"Promotion {customer['promo']}", -promo)
        does: Adds the discount to the invoice as a negative line.
  - id: flow-country-to-total
    data: The country of a customer
    steps:
      - symbol: legacy_billing/cli.py::_add_customer
        snippet: '"country": args.country,'
        does: Takes the country from the command line.
      - symbol: legacy_billing/billing.py::add_vat
        snippet: invoice.vat = taxes.vat_amount(invoice.subtotal(), customer["country"])
        does: Sets the VAT of the invoice.
      - symbol: legacy_billing/taxes.py::vat_amount
        snippet: money.percent_of(cents, vat_rate(country))
        does: Applies the rate of the country.
      - symbol: legacy_billing/invoices.py::Invoice.total
        snippet: return self.subtotal() + self.vat
        does: Adds the VAT to the amount to pay.
  - id: flow-period-to-ledger
    data: The period of the billing run
    steps:
      - symbol: legacy_billing/billing.py::run_billing
        snippet: state.RUN["period"] = period
        does: Puts the period into the shared state.
      - symbol: legacy_billing/ledger.py::post_entry
        snippet: '"period": state.RUN.get("period", ""),'
        does: Reads it from the shared state for every posting.

dynamic_calls:
  - id: dynamic-export
    symbol: legacy_billing/billing.py::export_ledger
    snippet: writer(ledger.entries())
    reason: The function is found by getattr with a name built from the format.
    targets:
      - legacy_billing/exporters.py::export_csv
      - legacy_billing/exporters.py::export_fixed
  - id: dynamic-hooks
    symbol: legacy_billing/billing.py::post_invoice
    snippet: hook(row)
    reason: The hooks are values in a shared list.
    targets: ["legacy_billing/audit.py::log_posting"]
  - id: dynamic-report
    symbol: legacy_billing/reports.py::run_report
    snippet: REPORTS[name]()
    reason: The function is a value of a dictionary, picked by a string.
    targets:
      - legacy_billing/reports.py::report_balances
      - legacy_billing/reports.py::report_unpaid
      - legacy_billing/reports.py::report_warnings

features:
  - id: feature-late-fees
    title: Late fees on overdue invoices
    modules: [legacy_billing/billing.py, legacy_billing/notify.py, legacy_billing/settings.py]
    symbols:
      - legacy_billing/billing.py::apply_late_fees
      - legacy_billing/billing.py::overdue_invoices
      - legacy_billing/billing.py::late_fee_for
      - legacy_billing/notify.py::late_fee_text
      - legacy_billing/settings.py::LATE_FEE_GRACE_DAYS
      - legacy_billing/settings.py::LATE_FEE_FLAT_CENTS
      - legacy_billing/settings.py::LATE_FEE_PERCENT
    uses:
      - legacy_billing/dates.py::days_after
      - legacy_billing/ledger.py::post_entry
      - legacy_billing/money.py::format_cents
      - legacy_billing/money.py::percent_of
      - legacy_billing/notify.py::queue_notice
      - legacy_billing/storage.py::read_rows
      - legacy_billing/storage.py::replace_row
    called_from:
      - symbol: legacy_billing/cli.py::main
        snippet: billing.apply_late_fees(args.today)
    state:
      - symbol: legacy_billing/billing.py::apply_late_fees
        snippet: state.RUN["late_fees"] = state.RUN.get("late_fees", 0) + charged
    tests: [tests/test_late_fees.py]
  - id: feature-discounts
    title: Promotion and loyalty discounts
    modules:
      - legacy_billing/billing.py
      - legacy_billing/catalog.py
      - legacy_billing/customers.py
      - legacy_billing/settings.py
    symbols:
      - legacy_billing/billing.py::apply_discounts
      - legacy_billing/billing.py::promo_discount
      - legacy_billing/billing.py::loyalty_discount
      - legacy_billing/billing.py::promo_uses
      - legacy_billing/billing.py::count_promo_use
      - legacy_billing/catalog.py::PROMOS
      - legacy_billing/catalog.py::find_promo
      - legacy_billing/customers.py::months_active
      - legacy_billing/settings.py::LOYALTY_MONTHS
      - legacy_billing/settings.py::LOYALTY_PERCENT
    uses:
      - legacy_billing/dates.py::parse_day
      - legacy_billing/dates.py::period_start
      - legacy_billing/invoices.py::Invoice.add_line
      - legacy_billing/invoices.py::Invoice.charges
      - legacy_billing/money.py::percent_of
      - legacy_billing/storage.py::read_rows
      - legacy_billing/storage.py::replace_row
    called_from:
      - symbol: legacy_billing/billing.py::bill_customer
        snippet: apply_discounts(invoice, customer)
    state:
      - symbol: legacy_billing/billing.py::promo_discount
        snippet: state.WARNINGS.append(f"{customer['id']} has the unknown code {code}")
      - symbol: legacy_billing/billing.py::count_promo_use
        snippet: state.RUN["promos"] = state.RUN.get("promos", 0) + 1
    tests: [tests/test_discounts.py]
